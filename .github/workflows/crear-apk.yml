name: Construir APK Gratis Neon Arena 360

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Java JDK 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: 5. Generar carpeta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 6. Compilar el archivo APK Release instalable
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 7. Subir el APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Arena-360-Instalador-APK
          path: android/app/build/outputs/apk/release/*.apk
